<!DOCTYPE html>
<html lang="id">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulir Izin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style> {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f8f9fa;
        font-family: Arial, Helvetica, sans-serif;
    }

    .form-card {
        max-width: 650px;
        margin: auto;
        padding: 30px;
        background: white;
        border-radius: 15px
        box-shadow: 0 4px 15px #00000010;
    }

    .form-control,
    .form-select {
        min-height: 46px;
        font-size: 16px;
    }

    textarea.form-control{
        min-height: 100px;
    }
    
    .btn {
        min-height: 46px;
    }

    #berhasil {
        display: none;
    }

    #berhasil:target {
        display: block;
    }

    @media(max-width:576px){
        .form-card{
            padding: 20px 16px;
        }

                    h2 {
                font-size: 22px;
            }

            main.container {
                padding-left: 14px;
                padding-right: 14px;
            }
        }

        @media (max-width: 375px) {
            .form-card {
                padding: 16px 12px;
            }

            h2 {
                font-size: 20px;
            }
    }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg
    navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold"

            data-bs-toggle="collapse"

        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
        id="navbarNav">
    
        <ul class="navbar-nav ms-auto">

            <li class="nav-item">
                <a class="nav-link"
                href="index.html">
                Beranda

            <li class="nav-item">

</body>

<main class="container my-5">

        <div class="form-card">

            <h2 class="text-center fw-bold mb-4">
                Formulir Pengajuan Izin / Sakit
            </h2>

            <form action="form.html#berhasil" method="get">
                <div class="mb-3">
                    <label for="nama"
                    class="form-label fw-semibold">
                    Nama Lengkap
                </label>

                <input type="text"
                    class="form-control"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama anda"
                    required>
                </div>

                <div class="mb-3">
                    <label for="nim"
                    class="form-label fw-semibold">
                    NIM
                </label>

                <input type="text"
                    class="form-control"
                    id="nim"
                    name="nim"
                    placeholder="Masukkan NIM"
                    required>
                </div>

                <div class="mb-3">
                    <label for="keterangan"
                    class="form-label fw-semibold">
                    Status Keterangan
                </label>

                <select class="form-select"
                id="keterangan"
                name="keterangan"
                required>

                <option value="" selected disabled>
                    Pilih status
                </option>

                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>

            </select>
        </div>

        <div class="mb-4">
            <label for="alasan"
            class="form-label fw-semibold">
            Alasan / Keterangan Singkat
        </label>

        <textarea class="form-control"
                    id="Alasan"
                    name="alasan"
                    rows="4"
                    placeholder="Tuliskan alasan anda..."
                    required></textarea>
        </div>

        <button type="submit"
                class="btn btn-success w-100 fw-semibold">
                Kirim Pengajuan
            </button>

            </form>

        <div id="berhasil"
            class="alert alert-success text-center mt-4">
        <h4 class="fw-bold">
            Pengajuan Berhasil!
        </h4>

        <p class="mb-3">
            Formulir izin / sakit berhasil diproses.
        </p>

        <a href="form.html"
            class="btn btn-success">
            Kembali ke Formulir
        </a>
    </div>
</div>
</main>

   <footer class="bg-dark text-white text-center py-4">
