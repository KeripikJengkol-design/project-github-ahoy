<!DOCTYPE html>>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak & Tentang - Absensi Kelas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: #212529;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        .judul {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h4 {
            font-weight: bold;
        }

        .tentang {
            background-color: white;
            padding: 25px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tentang p {
            line-height: 1.7;
            margin-bottom: 0;
        }

        footer {
            margin-top: 50px;
        }

        @media (max-width: 576px) {
            .judul {
                font-size: 24px;
            }

            .card {
                padding: 20px !important;
            }
        }
    </style>
</head>
